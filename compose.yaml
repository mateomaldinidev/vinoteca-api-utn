services:
  mysql:
    image: mysql:8.0
    container_name: vinoteca-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-vinoteca_db}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    # Verifica que MySQL esté listo antes de arrancar la app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vinoteca-network

  # Crea la base y otorga permisos aunque el volumen de MySQL ya exista.
  # Los scripts de /docker-entrypoint-initdb.d solo corren con volumen vacio.
  db-init:
    image: mysql:8.0
    container_name: vinoteca-db-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-vinoteca_db}
      DB_USER: ${DB_USER:-user}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root}
    entrypoint: ["sh", "-c"]
    command:
      - |
        mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS $$DB_NAME; GRANT ALL PRIVILEGES ON $$DB_NAME.* TO '$$DB_USER'@'%'; FLUSH PRIVILEGES;"
    networks:
      - vinoteca-network

  mailhog:
    image: mailhog/mailhog
    container_name: vinoteca-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - vinoteca-network

  app:
    build: .
    container_name: vinoteca-app
    ports:
      - "8080:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vinoteca_db}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      APP_BASE_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - vinoteca-network

volumes:
  mysql_data:

networks:
  vinoteca-network:
    driver: bridge
